# Render Blueprint — deploys the Ocean Sandbox as a web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ocean-sandbox
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_MODELS
        value: "gpt-5.4"
      - key: AITUNNEL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: "eleven_multilingual_v2"
